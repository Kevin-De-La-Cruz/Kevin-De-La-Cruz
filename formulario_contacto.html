<section id="contacto">
    <h2>Contáctanos</h2>
    <p>Si tienes alguna consulta o deseas obtener más información, no dudes en ponerte en contacto con nosotros. Estamos aquí para ayudarte.</p>
    <link rel="stylesheet" href="css/estilos_formulario.css">
    <form id="contactForm" action="javascript:void(0);" method="post" class="contact-form">
      <div class="form-group">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="nombre" required>
      </div>
  
      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required>
      </div>
  
      <div class="form-group">
        <label for="telefono">Teléfono (Opcional):</label>
        <input type="tel" id="telefono" name="telefono">
      </div>
  
      <div class="form-group">
        <label for="message">Mensaje:</label>
        <textarea id="message" name="mensaje" rows="5" required></textarea>
      </div>
  
      <button type="submit" class="btn-submit">Enviar</button>
    </form>
    <div id="responseMessage"></div>
    <script src="js/scripts_formulario.js"></script>
</section>
